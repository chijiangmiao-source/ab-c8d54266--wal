name: wal-recover

services:
  app:
    build: .
    image: wal-recover:latest
    environment:
      PORT: 8080
    ports:
      # Host-side port is configurable for review scripts: HOST_PORT=9090 docker compose up
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python3
        - "-c"
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2).status==200 else 1)"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  verify:
    build: .
    image: wal-recover:latest
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:8080
    command: ["sh", "/srv/verify.sh"]
    restart: "no"
